[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API Redirects
[[redirects]]
  from = "/api/gemini/*"
  to = "/.netlify/functions/gemini-proxy?path=:splat"
  status = 200

[[redirects]]
  from = "/api/groq/*"
  to = "/.netlify/functions/groq-proxy?path=:splat"
  status = 200



[[redirects]]
  from = "/api/feedback/*"
  to = "https://formspree.io/:splat"
  status = 200

# Fix: Ensure assets return 404 instead of index.html if missing
# This avoids the "MIME type text/html" error and circular redirect loop
[[redirects]]
  from = "/assets/*"
  to = "/404"
  status = 404

# Redirect all navigation routes to index.html for SPA (HashRouter compatible)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache Control and Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Prevent index.html from being cached by the browser/CDN
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
