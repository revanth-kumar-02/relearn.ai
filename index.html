  <!-- Material Symbols Styling -->
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
      scroll-behavior: smooth;
    }

    img {
      content-visibility: auto;
      image-rendering: -webkit-optimize-contrast;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none !important;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'liga';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      /* Hide icon text until font loads — prevents FOUT showing raw names */
      color: transparent !important;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Once the font is loaded, the JS below adds this class to <html> */
    html.icons-loaded .material-symbols-outlined {
      color: inherit !important;
      opacity: 1;
    }

    .material-symbols-outlined.filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Mobile Only Scrollbar Hiding */
    @media (max-width: 767px) {
      ::-webkit-scrollbar {
        display: none !important;
      }

      * {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
    }

    /* Optional class for elements that should always hide scrollbars */
    .no-scrollbar-always::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar-always {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Ensure icons don't block input clicks */
    .input-icon {
      pointer-events: none;
      user-select: none;
    }

    /* Yoyo Marquee Animation */
    @keyframes yoyo {
      0%, 10% { transform: translateX(0); }
      90%, 100% { transform: translateX(var(--scroll-dist, 0)); }
    }

    .marquee-container {
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .marquee-content {
      display: flex;
      gap: 1.5rem;
      width: max-content;
      will-change: transform;
    }

    .marquee-content.animating {
      animation: yoyo 20s ease-in-out infinite alternate;
    }

    .marquee-content:hover {
      animation-play-state: paused;
    }

    @media (max-width: 768px) {
      .marquee-content.animating {
        animation-duration: 30s;
      }
    }
  </style>

  <!-- Font loading detection: reveal icons only after Material Symbols font is ready -->
  <script>
    (function() {
      // Use Font Loading API to detect when Material Symbols is available
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
          document.documentElement.classList.add('icons-loaded');
        });
      }
      // Safety timeout: always reveal icons after 3 seconds even if detection fails
      setTimeout(function() {
        document.documentElement.classList.add('icons-loaded');
      }, 3000);
    })();
  </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New content is available; please refresh.
                    window.location.reload();
                  }
                });
              }
            });
          }).catch(err => {
            console.log('SW registration failed: ', err);
          });
        });

        // Handle controller change (ensures all tabs stay in sync)
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            window.location.reload();
            refreshing = true;
          }
        });
      }
    </script>
